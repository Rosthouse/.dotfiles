[bar.default]
center = ["clock", "cat"]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "battery",
]
start = ["launcher", "wallpaper", "workspaces", "bar", "widget"]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-3", "lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[plugins]
enabled = [
  "noctalia/bongocat",
  "raycursive/niri-displays",
  "alexander/screen-toolkit",
  "noctalia/wallpaper_depth",
  "noctalia/wallhaven",
  "davemhammer/tailscale",
]

[theme.templates]
builtin_ids = ["ghostty", "niri"]

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.bar]
type = "raycursive/niri-displays:bar"
show_resolution = false

[widget.cat]
type = "noctalia/bongocat:cat"
scale = 1.5
input_devices = [
  "/dev/input/by-id/usb-Keychron_Keychron_K10-event-kbd",
  "/dev/input/by-id/usb-ZMK_Project_Corne_Choc_Pro_43D90AD0440B23BE-if02-event-kbd",
  "/dev/input/by-path/platform-i8042-serio-0-event-kbd",
  "/dev/input/by-id/usb-Keychron_Keychron_Q11_Ultra_8K_L_0123456789ABCDEF-event-kbd",
  "/dev/input/by-id/usb-Keychron_Keychron_Ultra-Link_8K-hidraw",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if01-event-kbd",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if02-event-kbd",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if01-hidraw",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if02-hidraw",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if03-hidraw",
  "/dev/input/by-id/usb-Keychron_Keychron_Link-if04-hidraw",
]

[widget.widget]
type = "alexander/screen-toolkit:widget"

[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3
